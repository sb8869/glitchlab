<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="bot-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bot-title">Robot</title>
  

  <g id="bot-root" fill="none" stroke="var(--bot-outline, #14343f)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    
    <g id="bot-antenna" style="transform-box: fill-box; transform-origin: 50% 100%;">
      <line x1="120" y1="44" x2="120" y2="30"></line>
      <circle cx="120" cy="22" r="8" fill="var(--bot-accent, #f6b93b)"></circle>
    </g>

    
    <rect id="bot-arm-left" x="44" y="134" width="16" height="48" rx="7" fill="var(--bot-accent, #f6b93b)"></rect>
    <rect id="bot-arm-right" x="180" y="134" width="16" height="48" rx="7" fill="var(--bot-accent, #f6b93b)"></rect>
    <line x1="48" y1="166" x2="56" y2="166"></line>
    <line x1="184" y1="166" x2="192" y2="166"></line>
    <circle cx="52" cy="184" r="7" fill="var(--bot-accent, #f6b93b)"></circle>
    <circle cx="188" cy="184" r="7" fill="var(--bot-accent, #f6b93b)"></circle>

    
    <g id="bot-feet">
      <rect id="bot-foot-left" x="80" y="198" width="32" height="16" rx="6" fill="var(--bot-accent, #f6b93b)"></rect>
      <rect id="bot-foot-right" x="128" y="198" width="32" height="16" rx="6" fill="var(--bot-accent, #f6b93b)"></rect>
    </g>

    
    <rect id="bot-body" x="64" y="122" width="112" height="80" rx="24" fill="var(--bot-body, #4fd1c5)"></rect>
    <line x1="108" y1="189" x2="108" y2="195"></line>
    <line x1="120" y1="189" x2="120" y2="195"></line>
    <line x1="132" y1="189" x2="132" y2="195"></line>
    <rect id="bot-chest-panel" x="94" y="142" width="52" height="40" rx="10" fill="var(--bot-face, #eef4f5)"></rect>
    <circle id="bot-chest-light" cx="120" cy="162" r="7" fill="var(--bot-accent, #f6b93b)"></circle>

    
    <g id="bot-head">
      <rect x="66" y="72" width="14" height="20" rx="4" fill="var(--bot-accent, #f6b93b)"></rect>
      <rect x="160" y="72" width="14" height="20" rx="4" fill="var(--bot-accent, #f6b93b)"></rect>
      <rect x="76" y="44" width="88" height="76" rx="22" fill="var(--bot-body, #4fd1c5)"></rect>
    </g>
    <rect id="bot-face-plate" x="88" y="58" width="64" height="48" rx="14" fill="var(--bot-face, #eef4f5)"></rect>

    
    <g id="bot-eyes"></g>

    
    <g id="bot-tell"></g>
  </g>
</svg>